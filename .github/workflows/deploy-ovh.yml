name: 🚀 Déployer EternaWeb sur OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publier sur OVH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le site
        uses: actions/checkout@v4

      - name: 🔐 Préparer la configuration Stripe et SMTP OVH
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OVH_SMTP_PASSWORD: ${{ secrets.OVH_SMTP_PASSWORD }}
        run: |
          mkdir -p api
          cat > api/config.php <<'PHP'
          <?php
          const STRIPE_SECRET_KEY = '__STRIPE_SECRET_KEY__';
          const STRIPE_WEBHOOK_SECRET = '__STRIPE_WEBHOOK_SECRET__';
          const OVH_SMTP_HOST = 'smtp.mail.ovh.net';
          const OVH_SMTP_PORT = 465;
          const OVH_SMTP_USER = 'contact@eternaweb.fr';
          const OVH_SMTP_PASSWORD = '__OVH_SMTP_PASSWORD__';
          PHP
          sed -i "s|__STRIPE_SECRET_KEY__|$STRIPE_SECRET_KEY|" api/config.php
          sed -i "s|__STRIPE_WEBHOOK_SECRET__|$STRIPE_WEBHOOK_SECRET|" api/config.php
          sed -i "s|__OVH_SMTP_PASSWORD__|$OVH_SMTP_PASSWORD|" api/config.php

      - name: 🔄 Actualiser les scripts EternaWeb
        run: |
          for f in $(grep -rl 'script src="app.js"' --include='*.html' .); do
            if grep -q 'cgv-menu-fix.js' "$f"; then
              sed -i 's#cgv-menu-fix.js[^\"]*#cgv-menu-fix.js?v=20260910#g' "$f"
            else
              sed -i "s#<script src=\"app.js\" defer></script>#<script src=\"app.js\" defer></script><script src=\"cgv-menu-fix.js?v=20260910\" defer></script>#" "$f"
            fi
            if grep -q 'site-fix.js' "$f"; then
              sed -i 's#site-fix.js[^\"]*#site-fix.js?v=20260910#g' "$f"
            else
              sed -i "s#<script src=\"app.js\" defer></script>#<script src=\"app.js\" defer></script><script src=\"site-fix.js?v=20260910\" defer></script>#" "$f"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="ew-mobile-form-fix"' not in s:
              fix = r'''<style id="ew-mobile-form-fix">
          @media (max-width:600px){
            #devisForm{display:flex!important;flex-direction:column!important;gap:0!important}
            #devisForm>.grid-2{order:1!important;display:grid!important;grid-template-columns:1fr!important;gap:12px!important;margin-bottom:4px!important}
            #devisForm>#ewPlanCarousel{order:2!important;display:flex!important;overflow-x:visible!important;gap:8px!important;padding:2px 0 10px!important;margin:0 0 8px!important}
            #devisForm>#ewPlanCarousel button{flex:1 1 0!important;min-width:0!important;min-height:72px!important;padding:10px 8px!important;text-align:center!important;border-radius:14px!important}
            #devisForm>#ewPlanCarousel button strong{font-size:.82rem!important;line-height:1.2!important}
            #devisForm>#ewPlanCarousel button span{font-size:.82rem!important;margin-top:5px!important}
            #devisForm>label:has(select[name="type"]){display:none!important}
            #devisForm>label:has(input[name="couleurs"]){order:5!important}
            #devisForm>label:has(select[name="style"]){order:6!important}
            #devisForm>label:has(#planDisplay){display:none!important}
            #devisForm>fieldset.full{order:4!important;margin:4px 0 12px!important;padding:14px 12px!important;border:1px solid #eadfd4!important;border-radius:14px!important;background:#fffdf9!important}
            #devisForm>fieldset.full label{display:flex!important;flex-direction:row!important;align-items:center!important;gap:10px!important;margin:10px 0!important;padding:5px 0!important}
            #devisForm>fieldset.full label input[type="checkbox"]{appearance:none!important;-webkit-appearance:none!important;width:19px!important;height:19px!important;min-width:19px!important;margin:0!important;border:1.5px solid #b9a890!important;border-radius:50%!important;background:#fff!important;position:relative!important}
            #devisForm>fieldset.full label input[type="checkbox"]:checked{border-color:#b39a68!important;background:#b39a68!important}
            #devisForm>fieldset.full label input[type="checkbox"]:checked:after{content:""!important;position:absolute!important;width:7px!important;height:7px!important;left:4px!important;top:4px!important;border-radius:50%!important;background:#fff!important}
            #devisForm>label:has(#devisFile){order:7!important}
            #devisForm>label:has(input[name="drive"]){order:8!important}
            #devisForm>label:has(textarea[name="contenu"]){order:9!important}
            #devisForm>#orderSummary{order:10!important}
            #devisForm>#sendForm{order:11!important;width:100%!important;margin-top:8px!important}
            #devisForm>#paymentReassurance{order:12!important}
            #devisForm>#ewPaymentMethods{order:13!important}
            #devisForm label{gap:7px!important;margin-bottom:10px!important}
            #devisForm label>span{font-size:.9rem!important;color:#5d4b3e!important}
            #devisForm input,#devisForm select,#devisForm textarea{border:1px solid #e6ddd4!important;background:#fff!important;border-radius:12px!important;padding:11px 12px!important;min-height:44px!important}
            #devisForm textarea{min-height:90px!important}
            #devisForm .tiny{line-height:1.45!important}
            #devisForm .addon-price{margin-left:auto!important;font-weight:700!important;color:#8a7047!important}
          }
          </style>
          <script id="ew-mobile-form-fix">
          (function(){
            function fix(){
              var f=document.getElementById('devisForm');
              if(!f)return;
              var grid=f.querySelector('.grid-2');
              var carousel=f.querySelector('#ewPlanCarousel');
              if(grid && carousel && carousel.parentNode===f){
                f.insertBefore(grid,carousel);
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix,{once:true});
            else fix();
          })();
          </script>'''
              s = s.replace('</head>', fix + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: 🚀 Synchroniser avec OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.cluster029.hosting.ovh.net
          username: eternag
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            netlify/**
            netlify.toml
            package.json
            package-lock.json
            README.md
            MERGE.md
            .ftp-deploy-sync-state.json
            .env
            .env.*
            data/orders/**
